<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="夏末的积雨云与夕阳">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#ef7d4f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6ece7"/>
    </linearGradient>
  </defs>

  <!-- 夕阳 -->
  <circle cx="196" cy="112" r="74" fill="url(#sun)"/>
  <!-- 飞鸟 -->
  <g stroke="#2b6f68" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M96 62q7-8 14 0M118 70q7-8 14 0"/>
  </g>

  <!-- 积雨云 -->
  <g fill="url(#cloud)" stroke="#8fc9be" stroke-width="2">
    <circle cx="112" cy="196" r="56"/>
    <circle cx="176" cy="212" r="44"/>
    <circle cx="66" cy="228" r="38"/>
    <circle cx="226" cy="238" r="32"/>
    <rect x="42" y="232" width="212" height="56" rx="28"/>
  </g>
  <!-- 云的阴影层 -->
  <g fill="#bfe0d8" opacity=".7">
    <circle cx="150" cy="250" r="30"/>
    <circle cx="204" cy="258" r="22"/>
  </g>

  <!-- 阵雨 -->
  <g stroke="#4f9d92" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M96 300l-6 14M136 300l-6 14M176 300l-6 14M216 300l-6 14"/>
  </g>
</svg>
